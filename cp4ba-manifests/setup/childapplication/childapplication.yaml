apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: cp4ba
  source:
    repoURL: https://github.com/lloydngcobo/CP4BA-with-ArgoCD
    path: cp4ba-manifests/namespace
    targetRevision: 25.0.0
  destination:
    server: https://kubernetes.default.svc 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:

---

